name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: config.settings.development

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The STATE.md stamp check needs real history to compute a merge-base.
          # The default shallow checkout cannot, and the script fails loudly
          # rather than degrading to a silent pass, so this is required.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff==0.15.14 bandit pip-audit
      - name: STATE.md header stamp
        # Only enforced when the change touches STATE.md; a no-op otherwise.
        # BASE_REF goes through env rather than into the run: line, so the value
        # is never interpolated at command position.
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: python scripts/check_state_stamp.py --base "origin/$BASE_REF"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Bandit security scan
        run: bandit -r apps/ -c pyproject.toml -ll || true
      - name: pip-audit
        run: pip install -r requirements.txt && pip-audit --strict || true
      - name: Semgrep SAST
        run: pip install semgrep && semgrep ci --config p/django --config p/python || true
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: umi_test
          POSTGRES_USER: umi
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://umi:test@localhost:5432/umi_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use-only
      ENCRYPTION_KEY: ""

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Django system checks
        run: python manage.py check
      - name: Run tests with coverage
        run: |
          coverage run -m pytest -v --tb=short
          coverage report --fail-under=50
          coverage xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: umi-exchange:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
