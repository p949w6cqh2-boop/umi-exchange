<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <title>Network</title>
  <!-- Central node -->
  <circle cx="100" cy="100" r="10" fill="#1A1A2E"/>
  <!-- Outer nodes -->
  <circle cx="55" cy="55" r="7" fill="#3B82F6"/>
  <circle cx="145" cy="55" r="7" fill="#3B82F6"/>
  <circle cx="45" cy="120" r="7" fill="#FBBF24"/>
  <circle cx="155" cy="120" r="7" fill="#FBBF24"/>
  <circle cx="75" cy="160" r="7" fill="#3B82F6"/>
  <circle cx="125" cy="160" r="7" fill="#3B82F6"/>
  <!-- Connections -->
  <line x1="100" y1="100" x2="55" y2="55" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="145" y2="55" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="45" y2="120" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="155" y2="120" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="75" y2="160" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <line x1="100" y1="100" x2="125" y2="160" stroke="#1A1A2E" stroke-width="1.5" opacity="0.3"/>
  <!-- Peer connections -->
  <line x1="55" y1="55" x2="145" y2="55" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
  <line x1="45" y1="120" x2="75" y2="160" stroke="#FBBF24" stroke-width="1" opacity="0.2"/>
  <line x1="155" y1="120" x2="125" y2="160" stroke="#FBBF24" stroke-width="1" opacity="0.2"/>
</svg>
