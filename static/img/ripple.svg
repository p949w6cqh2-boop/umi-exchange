  <title>Ripple Effect</title>
  <!-- Concentric circles radiating outward -->
  <circle cx="100" cy="100" r="8" fill="#3B82F6"/>
  <circle cx="100" cy="100" r="24" stroke="#3B82F6" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="100" cy="100" r="44" stroke="#3B82F6" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="100" cy="100" r="64" stroke="#3B82F6" stroke-width="1" fill="none" opacity="0.25"/>
  <circle cx="100" cy="100" r="84" stroke="#3B82F6" stroke-width="0.75" fill="none" opacity="0.15"/>
</svg>
