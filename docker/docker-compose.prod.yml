# Production. Under key custody the app and the worker are brought up by the rig from the
# steward's laptop (scripts/deploy-with-keys.sh, docs/deploy-runbook.md step 5); a plain
# `docker compose ... up -d` on the droplet starts them without keys, and production
# refuses to boot.

# The environment the app AND the worker get: one block, so the two cannot drift apart
# (2026-10-18). A key that reached the app but not the worker would boot a worker with none.
x-app-environment: &app-environment
  - DJANGO_SETTINGS_MODULE=config.settings.production
  # 🔑 NO KEY MATERIAL IN THIS BLOCK (changed 2026-11-02, ethics-gate box 3).
  # Docker writes a container's resolved environment into its own config on disk
  # (/var/lib/docker/containers/<id>/config.v2.json) and keeps it there for the
  # container's LIFETIME. So SECRET_KEY / ENCRYPTION_KEY / ENCRYPTION_KEYS /
  # BLIND_INDEX_KEY, named here from 2026-09-11 to 2026-11-02, were plaintext on
  # the droplet disk under root the whole time — the residue
  # docs/key-custody-design.md §Named residuals carried as open, doubled on
  # 2026-10-18 when the worker took this same block.
  # They now arrive as a FILE on a tmpfs bind mount (see each service's volumes).
  # The config records this PATH; the secret is never in it.
  # ⚠️ Pinned by tests/test_secrets_file.py — re-adding a key line here reverts the
  # fix. The 2026-09-11 and 2026-10-01 boot failures are the reason it is tempting.
  - UMI_SECRETS_FILE=/run/umi/keys.env
  # Runtime role: defaults keep the single-role setup working, but the
  # append-only audit gate (threat-model must-fix #1) needs the app on a
  # non-owner role — see deployment-checklist.md "Database roles".
  - DATABASE_URL=postgres://${APP_DB_USER:-umi}:${APP_DB_PASSWORD:-${DB_PASSWORD}}@db:5432/umi_exchange
  - AUDIT_DB_APP_ROLE=${APP_DB_USER:-umi}
  - REDIS_URL=redis://redis:6379/0

services:
  app:
    image: umi-exchange:local  # built on the droplet: docker build -t umi-exchange:local -f docker/Dockerfile .
    restart: unless-stopped
    env_file: ../.env
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_logs:/app/logs
      # GeoIP country database (docs/specs/geolocking.md). Unused unless GEO_DB_PATH points here,
      # e.g. GEO_DB_PATH=/app/geo/dbip-country-lite.mmdb. A volume, so the monthly
      # `manage.py refresh_geoip` survives the container being recreated by a deploy.
      - geo_data:/app/geo
      # Key material, read-only, from HOST tmpfs. /run is RAM: never written to a
      # block device, cleared by a reboot. The rig writes it and no longer shreds
      # it, because the container re-reads it on every restart.
      # 🔴 NOT /dev/shm, and that is the point (changed on review, 2026-11-02):
      # /dev/shm is mode 1777, so any local user could pre-create this path — or a
      # symlink at it — and root's write would land in a file THEY own. /run is
      # root-owned 0755, so non-root cannot create anything there at all, and the
      # rig makes /run/umi-keys itself root-owned 0700.
      # ⚠️ If this source file is missing, Docker creates a DIRECTORY here and the
      # app refuses to boot naming UMI_SECRETS_FILE (config/settings/base.py).
      - /run/umi-keys/keys.env:/run/umi/keys.env:ro
    # Health monitoring: the app had no healthcheck (db does). Uses python (always
    # in the image) so we don't depend on curl. Sends X-Forwarded-Proto: https so
    # SECURE_SSL_REDIRECT doesn't 301 the probe to TLS (prod trusts that header),
    # and passes HEALTH_CHECK_TOKEN if one is configured. /health/ is the LB probe.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import os,sys,urllib.request;
          t=os.environ.get('HEALTH_CHECK_TOKEN','');
          u='http://localhost:8000/health/'+('?token='+t if t else '');
          sys.exit(0 if urllib.request.urlopen(urllib.request.Request(u, headers={'X-Forwarded-Proto':'https'}), timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M

  # The django-q worker (2026-10-18). Every recurring job the app registers runs here and
  # nowhere else: expiry of needs, offers and match proposals, the retention shreds of
  # docs/privacy-retention.md, the casework digest. The app container runs gunicorn only,
  # so until this service existed the schedules were registered on every deploy and nothing
  # ran them (read on the droplet 2026-10-18: zero tasks ever run, every next_run still at
  # the 10-13 deploy). Same image and environment as the app, keys included: the custody
  # rig creates it while the keys are in tmpfs and starts it only after migrate succeeds.
  worker:
    image: umi-exchange:local
    restart: unless-stopped
    command: ["python", "manage.py", "qcluster"]
    env_file: ../.env
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_logs:/app/logs
      # Same key file as the app, same reasoning. 2026-10-18's lesson: a key that
      # reached the app but not the worker boots a worker with none.
      - /run/umi-keys/keys.env:/run/umi/keys.env:ro
    # The image's HEALTHCHECK probes the app's HTTP port, which the worker never serves.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          memory: 384M

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: umi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: umi_exchange
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umi"]
      interval: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - app

  # Optional: Uptime monitoring
  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime_data:/app/data
    profiles: ["monitoring"]  # Only starts with: docker compose --profile monitoring up

volumes:
  pgdata:
  pgbackups:
  redisdata:
  caddydata:
  caddyconfig:
  app_logs:
  uptime_data:
  geo_data:
