{# Partial: recent notifications for the HTMX dropdown #}
{% for n in notifications %}
<a href="{% if n.link %}{{ n.link }}{% else %}{% url 'notification-list' %}{% endif %}"
   class="block px-4 py-3 hover:bg-gray-50 transition-colors border-b border-gray-100 last:border-0 {% if not n.is_read %}bg-blue-50/50{% endif %}">
  <p class="text-sm font-medium text-gray-900 truncate">{{ n.title }}</p>
  <p class="text-xs text-gray-500 mt-0.5 truncate">{{ n.body }}</p>
  <span class="text-xs text-gray-400">{{ n.created_at|timesince }} ago</span>
</a>
{% empty %}
<p class="p-4 text-sm text-gray-500 text-center">No notifications yet.</p>
{% endfor %}
{% if notifications %}
<a href="{% url 'notification-list' %}" class="block text-center text-xs text-blue-600 hover:text-blue-800 py-2 border-t border-gray-100">View all notifications</a>
{% endif %}
