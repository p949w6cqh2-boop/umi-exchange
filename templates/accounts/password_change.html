{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-xl font-semibold text-gray-900 mb-6">Change Password</h1>
  <form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
      <input type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
             class="w-full border border-gray-300 rounded-lg px-3 py-3 text-base min-h-[44px]"
             {% if field.value %}value="{{ field.value }}"{% endif %}>
      {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
      {% if field.help_text %}<p class="text-xs text-gray-400 mt-1">{{ field.help_text }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full btn-primary transition-colors">
      Update Password
    </button>
  </form>
</div>
{% endblock %}
