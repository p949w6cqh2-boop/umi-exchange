{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="text-xl font-semibold text-gray-900 mb-6">Reset Password</h1>
  <p class="text-sm text-gray-600 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
  <form method="post" class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input type="email" name="email" id="id_email" required
             class="w-full border border-gray-300 rounded-lg px-3 py-3 text-base min-h-[44px]"
             placeholder="your@email.com">
    </div>
    <button type="submit" class="w-full btn-primary transition-colors">
      Send Reset Link
    </button>
  </form>
  <p class="text-center mt-4"><a href="{% url 'login' %}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to login</a></p>
</div>
{% endblock %}
