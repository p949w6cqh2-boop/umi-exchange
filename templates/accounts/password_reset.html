{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <h1 class="font-serif text-2xl font-semibold tracking-tight text-parish-ink mb-6">Reset Password</h1>
  <p class="text-sm text-parish-ink/60 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
  <form method="post" class="umi-card space-y-4">
    {% csrf_token %}
    <div>
      <label for="id_email" class="umi-label">Email</label>
      <input type="email" name="email" id="id_email" required
             class="w-full border border-parish-border rounded-lg px-3 py-3 text-base min-h-[44px]"
             placeholder="your@email.com">
    </div>
    <button type="submit" class="w-full btn-primary transition-colors">
      Send Reset Link
    </button>
  </form>
  <p class="text-center mt-4"><a href="{% url 'login' %}" class="text-sm text-umi-primary hover:text-umi-primary-hover">&larr; Back to login</a></p>
</div>
{% endblock %}
