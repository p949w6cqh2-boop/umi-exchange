{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8 md:mt-16">
  <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6 md:p-8">
    <h1 class="text-xl font-semibold text-gray-900 mb-6">Sign In</h1>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}" class="text-sm font-medium text-gray-700 mb-1 block">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
      </div>
      {% endfor %}
      <button type="submit" class="w-full bg-[var(--umi-primary)] hover:bg-[#16213E] text-white font-semibold px-6 py-3 rounded-lg min-h-[48px] mt-6">Sign In</button>
    </form>
    <p class="text-sm text-gray-500 mt-4 text-center">New here? <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-800">Create account</a></p>
  </div>
</div>
{% endblock %}
