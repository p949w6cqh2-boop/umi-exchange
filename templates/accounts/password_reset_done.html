{% extends "base.html" %}
{% block title %}Check Your Email{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-12">
  <h1 class="text-xl font-semibold text-gray-900 mb-4">Check Your Email</h1>
  <p class="text-sm text-gray-600 mb-6">If an account exists with that email, we've sent a password reset link. Check your inbox (and spam folder).</p>
  <a href="{% url 'login' %}" class="text-sm text-blue-600 hover:text-blue-800">&larr; Back to login</a>
</div>
{% endblock %}
