{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-12">
  <h1 class="text-xl font-semibold text-gray-900 mb-4">Password Reset Complete</h1>
  <p class="text-sm text-gray-600 mb-6">Your password has been set. You can now log in with your new password.</p>
  <a href="{% url 'login' %}" class="inline-block bg-[var(--umi-primary)] hover:bg-[#064E2B] text-white font-semibold px-6 py-3 rounded-lg min-h-[48px] transition-colors">
    Sign In
  </a>
</div>
{% endblock %}
