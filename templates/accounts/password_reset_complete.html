{% extends "base.html" %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center py-12">
  <h1 class="font-serif text-2xl font-semibold tracking-tight text-parish-ink mb-4">Password Reset Complete</h1>
  <p class="text-sm text-parish-ink/60 mb-6">Your password has been set. You can now log in with your new password.</p>
  <a href="{% url 'login' %}" class="inline-block btn-primary transition-colors">
    Sign In
  </a>
</div>
{% endblock %}
