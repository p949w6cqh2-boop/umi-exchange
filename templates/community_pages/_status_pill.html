{% comment %}Status pill for a community page. Include with: page.{% endcomment %}
{% if page.status == 'published' %}
<span class="inline-block text-[10px] font-bold uppercase tracking-wider bg-umi-primary text-white px-2.5 py-0.5 rounded-full">Live</span>
{% elif page.status == 'draft' %}
<span class="inline-block text-[10px] font-bold uppercase tracking-wider border border-parish-border text-parish-ink/60 px-2.5 py-0.5 rounded-full">Draft</span>
{% else %}
<span class="inline-block text-[10px] font-bold uppercase tracking-wider border border-parish-border text-parish-ink/45 px-2.5 py-0.5 rounded-full">Archived</span>
{% endif %}
