{% load notifications_tags %}
{% unread_count request.user as n_count %}
<div x-data="{ open: false }" class="relative">
  <button @click="open = !open" class="relative p-2 min-h-[44px] min-w-[44px] flex items-center justify-center"
          aria-label="Notifications{% if n_count %}, {{ n_count }} unread{% endif %}">
    <svg class="w-6 h-6 text-parish-ink/70" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
    </svg>
    {% if n_count %}
    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold rounded-full min-w-[20px] h-5 flex items-center justify-center">
      {{ n_count|default:"0" }}
    </span>
    {% endif %}
  </button>
  <div x-show="open" @click.away="open = false" x-cloak
       class="absolute right-0 mt-2 w-80 bg-white shadow-lg rounded-lg border border-[var(--umi-border)] z-20 max-h-96 overflow-y-auto">
    <div class="p-3 border-b border-[var(--umi-border)] flex justify-between items-center">
      <span class="text-sm font-medium text-parish-ink">Notifications</span>
      <a href="{% url 'notification-list' %}" class="text-xs text-umi-primary hover:text-umi-primary-hover">View all</a>
    </div>
    <div hx-get="{% url 'notifications-recent' %}" hx-trigger="intersect once" hx-swap="innerHTML">
      <p class="p-4 text-sm text-parish-ink/45 text-center">Loading&hellip;</p>
    </div>
  </div>
</div>
