{# Reusable category grid: radio group for category selection. #}
{# Usage: {% include "components/_category_grid.html" with categories=categories field_name="category" %} #}
<fieldset>
  <legend class="umi-label !mb-2">{{ legend|default:"Choose a category" }}</legend>
  <div class="grid grid-cols-3 sm:grid-cols-5 gap-3" role="radiogroup">
    {% for cat in categories %}
    <label class="flex flex-col items-center justify-center min-w-[64px] min-h-[64px] border-2 rounded-xl cursor-pointer transition-colors
                  hover:border-parish-border hover:bg-parish-soft has-[:checked]:border-[var(--umi-primary)] has-[:checked]:bg-[#E8F2F1]">
      <input type="radio" name="{{ field_name|default:'category' }}" value="{{ cat.id }}" class="sr-only"
             {% if forloop.first and not selected %}checked{% elif selected == cat.id %}checked{% endif %}>
      <span class="text-2xl">{{ cat.icon }}</span>
      <span class="text-xs text-center mt-1 line-clamp-1">{{ cat.name }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>
