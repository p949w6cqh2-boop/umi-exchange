{# Trust badge: community-level trust indicator. #}
{# Usage: {% include "components/_trust_badge.html" with level="verified" community_name="St. Mary's" %} #}
{% if level == "verified" %}
<span class="inline-flex items-center gap-1 text-xs font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full"
      title="Verified community">
  <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
  </svg>
  Verified
</span>
{% elif level == "trusted" %}
<span class="inline-flex items-center gap-1 text-xs font-medium text-umi-primary bg-[#E8F2F1] px-2 py-0.5 rounded-full"
      title="Trusted community member">
  <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
    <path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
  </svg>
  Trusted
</span>
{% else %}
<span class="inline-flex items-center gap-1 text-xs font-medium text-parish-ink/55 bg-parish-soft px-2 py-0.5 rounded-full"
      title="Community member">
  <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
    <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
  </svg>
  Member
</span>
{% endif %}
