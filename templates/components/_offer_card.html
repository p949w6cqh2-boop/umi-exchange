{# Offer card: cool blue accent. No contact info. #}
<a href="{% url 'offer-detail' community.slug offer.id %}"
   class="block bg-blue-50 border-l-4 border-blue-400 rounded-lg p-4 shadow-sm hover:shadow-md transition-shadow"
   aria-label="Offer: {{ offer.title }}">
  <div class="flex items-start justify-between gap-2">
    <div class="flex items-center gap-2">
      <span class="text-xl">{{ offer.category.icon }}</span>
      <span class="text-sm text-gray-500">{{ offer.category.name }}</span>
    </div>
    <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-800">Offer</span>
  </div>
  <h3 class="text-lg font-semibold text-gray-900 mt-2 line-clamp-1">{{ offer.title }}</h3>
  {% if offer.description %}
  <p class="text-base text-gray-600 mt-1 line-clamp-2">{{ offer.description }}</p>
  {% endif %}
  <div class="flex items-center gap-2 mt-3 text-sm text-gray-500">
    <span>{{ offer.offerer.display_name }}</span>
    <span>&middot;</span>
    <span>{{ offer.created_at|timesince }} ago</span>
  </div>
</a>
