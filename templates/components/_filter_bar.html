{# Filter bar: category + urgency + search. HTMX-powered live filtering. #}
{# Usage: {% include "components/_filter_bar.html" with community=community categories=categories feed_url=feed_url %} #}
<div class="flex flex-wrap items-center gap-3 p-3 bg-white rounded-lg shadow-sm border border-gray-200 mb-4">
  <select name="category"
          hx-get="{{ feed_url }}" hx-target="#feed-results" hx-swap="innerHTML"
          hx-include="[name='urgency'],[name='q']"
          class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px]"
          aria-label="Filter by category">
    <option value="">All Categories</option>
    {% for cat in categories %}
    <option value="{{ cat.id }}">{{ cat.icon }} {{ cat.name }}</option>
    {% endfor %}
  </select>
  <select name="urgency"
          hx-get="{{ feed_url }}" hx-target="#feed-results" hx-swap="innerHTML"
          hx-include="[name='category'],[name='q']"
          class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px]"
          aria-label="Filter by urgency">
    <option value="">Any Urgency</option>
    <option value="low">Low</option>
    <option value="medium">Medium</option>
    <option value="high">High</option>
    <option value="critical">Critical</option>
  </select>
  <input type="text" name="q" placeholder="Search..."
         hx-get="{{ feed_url }}" hx-target="#feed-results"
         hx-trigger="keyup changed delay:300ms" hx-include="[name='category'],[name='urgency']"
         class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px] flex-grow"
         aria-label="Search needs and offers">
</div>
