{# Filter bar — reusable category/urgency/search filter. #}
{# Expects: community, categories queryset, filter_url (the HTMX target URL), target_id. #}
<div class="flex flex-wrap items-center gap-3 p-3 bg-white rounded-lg shadow-sm border border-gray-200 mb-4"
     role="search" aria-label="Filter results">
  <select name="category"
          hx-get="{{ filter_url }}" hx-target="#{{ target_id }}" hx-swap="innerHTML"
          hx-include="[name='urgency'],[name='q']"
          class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px]"
          aria-label="Filter by category">
    <option value="">All Categories</option>
    {% for cat in categories %}
    <option value="{{ cat.id }}" {% if request.GET.category == cat.id|slugify %}selected{% endif %}>
      {{ cat.icon }} {{ cat.name }}
    </option>
    {% endfor %}
  </select>

  {% if show_urgency|default:True %}
  <select name="urgency"
          hx-get="{{ filter_url }}" hx-target="#{{ target_id }}" hx-swap="innerHTML"
          hx-include="[name='category'],[name='q']"
          class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px]"
          aria-label="Filter by urgency">
    <option value="">Any Urgency</option>
    <option value="low" {% if request.GET.urgency == 'low' %}selected{% endif %}>Low</option>
    <option value="medium" {% if request.GET.urgency == 'medium' %}selected{% endif %}>Medium</option>
    <option value="high" {% if request.GET.urgency == 'high' %}selected{% endif %}>High</option>
    <option value="critical" {% if request.GET.urgency == 'critical' %}selected{% endif %}>Critical</option>
  </select>
  {% endif %}

  <input type="text" name="q" placeholder="Search..."
         value="{{ request.GET.q|default:'' }}"
         hx-get="{{ filter_url }}" hx-target="#{{ target_id }}"
         hx-trigger="keyup changed delay:300ms"
         hx-include="[name='category'],[name='urgency']"
         class="border border-gray-300 rounded-lg px-3 py-2 text-base min-h-[44px] flex-grow"
         aria-label="Search by keyword">
</div>
