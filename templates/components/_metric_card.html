{# Metric card: single stat with label. #}
{# Usage: {% include "components/_metric_card.html" with label="Active Needs" value=42 %} #}
<div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 hover:shadow-md transition-shadow">
  <p class="text-sm text-gray-500 font-medium">{{ label }}</p>
  <p class="text-3xl font-bold text-gray-900 mt-1 tabular-nums">{{ value }}</p>
  {% if subtitle %}
  <p class="text-xs text-gray-400 mt-1">{{ subtitle }}</p>
  {% endif %}
</div>
