{# Urgency selector: horizontal radio group with colour-coded pills. #}
{# Usage: {% include "components/_urgency_selector.html" with choices=form.fields.urgency.choices selected="medium" %} #}
<fieldset>
  <legend class="text-sm font-medium text-gray-700 mb-2">{{ legend|default:"How urgent?" }}</legend>
  <div class="flex flex-wrap gap-3" role="radiogroup">
    {% for value, label in choices %}
    <label class="flex items-center gap-2 px-4 py-3 rounded-lg border-2 cursor-pointer min-h-[48px] transition-colors
                  {% if value == 'low' %}hover:border-green-300 has-[:checked]:bg-green-100 has-[:checked]:border-green-500
                  {% elif value == 'medium' %}hover:border-amber-300 has-[:checked]:bg-amber-100 has-[:checked]:border-amber-500
                  {% elif value == 'high' %}hover:border-orange-300 has-[:checked]:bg-orange-100 has-[:checked]:border-orange-500
                  {% else %}hover:border-red-300 has-[:checked]:bg-red-100 has-[:checked]:border-red-500{% endif %}">
      <input type="radio" name="{{ field_name|default:'urgency' }}" value="{{ value }}" class="sr-only"
             {% if value == selected|default:"medium" %}checked{% endif %}>
      <span class="w-3 h-3 rounded-full flex-shrink-0
        {% if value == 'low' %}bg-green-500{% elif value == 'medium' %}bg-amber-500{% elif value == 'high' %}bg-orange-500{% else %}bg-red-500{% endif %}"></span>
      <span class="text-sm font-medium">{{ label }}</span>
    </label>
    {% endfor %}
  </div>
</fieldset>
