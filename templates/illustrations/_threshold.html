{% comment %}Parish Linocut — original UMI illustration ("The threshold — two doors in one wall:
   step through the open one, or paint a new one"). Decorative; ink follows text color,
   washes follow the community theme.{% endcomment %}
<svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg"
     class="{{ class|default:'w-full h-auto' }}" aria-hidden="true" focusable="false">
  <defs><filter id="g-thresh"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0.05 0"/></filter></defs>
  <ellipse cx="120" cy="152" rx="100" ry="13" fill="var(--umi-primary)" opacity="0.10"/>
  <path d="M20 150 H220" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- the parish wall -->
  <path d="M36 150 V64 L120 40 L204 64 V150" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 64 L120 40 L204 64" fill="var(--umi-primary)" opacity="0.08"/>
  <!-- small cross finial at the apex -->
  <path d="M120 40 V26 M113 32 h14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <!-- left door: arched, ajar, warm light spilling -->
  <path d="M58 150 V92 a20 20 0 0 1 40 0 V150" stroke="currentColor" stroke-width="2.5"/>
  <path d="M62 150 V93 a16 16 0 0 1 32 0 V150 Z" fill="var(--umi-accent)" opacity="0.30"/>
  <path d="M62 150 L84 142 V96 a14 14 0 0 0 -22 -3 Z" fill="currentColor" opacity="0.82"/>
  <path d="M84 142 L62 150 L104 166 Z" fill="var(--umi-accent)" opacity="0.35"/>
  <circle cx="80" cy="120" r="2.2" fill="var(--umi-accent)"/>
  <!-- right door: arched, fresh paint, ladder and pot -->
  <path d="M142 150 V92 a20 20 0 0 1 40 0 V150" stroke="currentColor" stroke-width="2.5"/>
  <path d="M146 150 V93 a16 16 0 0 1 32 0 V150 Z" fill="var(--umi-primary)" opacity="0.34"/>
  <path d="M146 118 h32 M162 93 V150" stroke="currentColor" stroke-width="2" opacity="0.5"/>
  <path d="M190 150 L198 108 M206 150 L198 108 M192 138 h11 M194 126 h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M128 141 h12 v9 h-12 z" fill="var(--umi-primary)" opacity="0.5" stroke="currentColor" stroke-width="2"/>
  <path d="M129 141 a5 5 0 0 1 10 0" stroke="currentColor" stroke-width="1.8"/>
  <!-- the neighbour at the threshold, faceless, mid-step toward the open door -->
  <circle cx="112" cy="106" r="8.5" fill="currentColor"/>
  <path d="M101 150 v-24 a11 11 0 0 1 22 0 v24" fill="var(--umi-primary)" opacity="0.78"/>
  <path d="M104 150 l-5 12 M119 150 l6 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <rect width="240" height="180" filter="url(#g-thresh)" opacity="0.5"/>
</svg>
