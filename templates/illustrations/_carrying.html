{% comment %}Parish Linocut — original UMI illustration ("Carried together — solidarity").
   Decorative; ink follows text color, washes follow the community theme.{% endcomment %}
<svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg"
     class="{{ class|default:'w-full h-auto' }}" aria-hidden="true" focusable="false">
  <defs><filter id="g-carry"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0.05 0"/></filter></defs>
  <ellipse cx="120" cy="154" rx="94" ry="11" fill="var(--umi-primary)" opacity="0.10"/>
  <!-- the beam carried together -->
  <rect x="30" y="62" width="180" height="10" rx="4" fill="var(--umi-accent)" opacity="0.8" transform="rotate(-4 120 67)"/>
  <rect x="30" y="62" width="180" height="10" rx="4" fill="none" stroke="currentColor" stroke-width="2" transform="rotate(-4 120 67)"/>
  <!-- three carriers of different heights, faceless -->
  <circle cx="62" cy="88" r="10" fill="currentColor"/>
  <path d="M48 154 v-44 a14 14 0 0 1 28 0 v44" fill="var(--umi-primary)" opacity="0.8"/>
  <path d="M56 86 l6 -14 M70 86 l-4 -14" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="124" cy="92" r="10" fill="currentColor"/>
  <path d="M110 154 v-40 a14 14 0 0 1 28 0 v40" fill="currentColor" opacity="0.85"/>
  <path d="M118 90 l4 -16 M132 90 l-2 -16" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="184" cy="96" r="8" fill="currentColor"/>
  <path d="M172 154 v-34 a12 12 0 0 1 24 0 v34" fill="var(--umi-accent)" opacity="0.75"/>
  <path d="M178 94 l4 -18 M192 94 l-2 -18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <rect width="240" height="180" filter="url(#g-carry)" opacity="0.5"/>
</svg>
