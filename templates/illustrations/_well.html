{% comment %}Parish Linocut — original UMI illustration ("The well — the community gathered around living water").
   Decorative; ink follows text color, washes follow the community theme.{% endcomment %}
<svg viewBox="0 0 240 180" fill="none" xmlns="http://www.w3.org/2000/svg"
     class="{{ class|default:'w-full h-auto' }}" aria-hidden="true" focusable="false">
  <defs><filter id="g-well"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 0.12 0 0 0 0 0.11 0 0 0 0 0.09 0 0 0 0.05 0"/></filter></defs>
  <ellipse cx="120" cy="150" rx="96" ry="14" fill="var(--umi-primary)" opacity="0.10"/>
  <path d="M24 148 H216" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <!-- the well -->
  <path d="M96 112 h48 v30 a24 8 0 0 1 -48 0 z" fill="var(--umi-primary)" opacity="0.16"/>
  <ellipse cx="120" cy="112" rx="24" ry="8" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M96 112 v30 a24 8 0 0 0 48 0 v-30" stroke="currentColor" stroke-width="2.5"/>
  <path d="M92 112 l14 -30 h28 l14 30" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M88 82 h64" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M120 82 v18" stroke="currentColor" stroke-width="2"/>
  <path d="M112 100 h16 v10 h-16 z" fill="var(--umi-accent)" opacity="0.55" stroke="currentColor" stroke-width="2"/>
  <!-- gathered figures, faceless -->
  <circle cx="56" cy="96" r="9" fill="currentColor"/>
  <path d="M44 148 v-26 a12 12 0 0 1 24 0 v26" fill="var(--umi-primary)" opacity="0.75"/>
  <circle cx="184" cy="96" r="9" fill="currentColor"/>
  <path d="M172 148 v-26 a12 12 0 0 1 24 0 v26" fill="var(--umi-accent)" opacity="0.7"/>
  <circle cx="206" cy="112" r="6.5" fill="currentColor"/>
  <path d="M198 148 v-18 a8.5 8.5 0 0 1 17 0 v18" fill="currentColor" opacity="0.8"/>
  <!-- rising water ripple -->
  <path d="M104 60 q16 -10 32 0" stroke="var(--umi-primary)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M110 50 q10 -7 20 0" stroke="var(--umi-primary)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <rect width="240" height="180" filter="url(#g-well)" opacity="0.5"/>
</svg>
