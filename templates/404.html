{% extends "base.html" %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto text-center py-20 umi-rise">
  <span class="font-serif text-[6rem] leading-none text-parish-ink/10 tabular">404</span>
  <h1 class="umi-display !text-3xl mt-4 mb-3">This page isn't on the board</h1>
  <p class="text-parish-ink/60 mb-9">It may have been taken down, or the address has a typo in it.</p>
  <div class="flex items-center justify-center gap-4">
    <a href="{% url 'landing' %}" class="btn-primary">Go home</a>
    <a href="javascript:history.back()" class="btn-secondary">Go back</a>
  </div>
</div>
{% endblock %}
