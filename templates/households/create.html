{% extends "base.html" %}
{% block title %}Create a Household{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-6">
    <h1 class="text-xl font-semibold text-gray-900 mb-4">Create a Household</h1>
    <p class="text-sm text-gray-600 mb-6">Group family members under one household. You'll get a code to share with your family.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_name" class="text-sm font-medium text-gray-700 mb-1 block">Household name <span class="text-gray-400">(optional)</span></label>
        {{ form.name }}
      </div>
      <button type="submit" class="w-full bg-[var(--umi-primary)] hover:bg-[#16213E] text-white font-semibold px-6 py-3 rounded-lg min-h-[48px]">Create Household</button>
    </form>
  </div>
</div>
{% endblock %}
