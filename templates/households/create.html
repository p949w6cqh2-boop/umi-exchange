{% extends "base.html" %}
{% block title %}Create a Household{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-8">
  <div class="umi-card">
    <h1 class="font-serif text-2xl font-semibold tracking-tight text-parish-ink mb-4">Create a Household</h1>
    <p class="text-sm text-parish-ink/60 mb-6">Group family members under one household. You'll get a code to share with your family.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label for="id_name" class="umi-label">Household name <span class="text-parish-ink/45">(optional)</span></label>
        {{ form.name }}
      </div>
      <button type="submit" class="w-full btn-primary">Create Household</button>
    </form>
  </div>
</div>
{% endblock %}
