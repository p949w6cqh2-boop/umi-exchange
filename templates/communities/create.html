{% extends "base.html" %}
{% block title %}Create a Community{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto mt-8">
  <h1 class="text-xl font-semibold text-gray-900 mb-6">Create a Community</h1>
  <form method="post" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    {% for field in form %}
    <div>
      <label for="{{ field.id_for_label }}" class="text-sm font-medium text-gray-700 mb-1 block">{{ field.label }}</label>
      {{ field }}
      {% if field.errors %}<p class="text-sm text-red-600 mt-1">{{ field.errors.0 }}</p>{% endif %}
    </div>
    {% endfor %}
    <button type="submit" class="w-full bg-[var(--umi-primary)] hover:bg-[#064E2B] text-white font-semibold px-6 py-3 rounded-lg min-h-[48px]">Create Community</button>
  </form>
</div>
{% endblock %}
