<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — UMI Exchange</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f4f4f5; color: #18181b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
    .card { background: #fff; border-radius: 1rem; border: 1px solid #e4e4e7; padding: 3rem; max-width: 28rem; text-align: center; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { font-size: 0.875rem; color: #71717a; margin-bottom: 1.5rem; line-height: 1.6; }
    a { display: inline-block; background: #166534; color: #fff; padding: 0.75rem 1.5rem; border-radius: 0.5rem; text-decoration: none; font-weight: 600; font-size: 0.875rem; }
    a:hover { background: #064E2B; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Something Went Wrong</h1>
    <p>We're sorry — an unexpected error occurred. Our team has been notified. Please try again in a moment.</p>
    <a href="/">Go Home</a>
  </div>
</body>
</html>
