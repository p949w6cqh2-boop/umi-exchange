<li id="grant-{{ grant.pk }}" class="bg-white border border-[var(--umi-border)] rounded-lg p-3 flex items-center justify-between gap-3 text-sm">
  <div>
    <p class="font-medium text-parish-ink/90">{{ grant.member.display_name }}
      <span class="text-xs text-parish-ink/70">({{ grant.role }})</span></p>
    <p class="text-xs text-parish-ink/70">{{ grant.reason }}
      {% if grant.expires_at %} · until {{ grant.expires_at|date:"M j, Y H:i" }}{% endif %}</p>
  </div>
  <form method="post" action="{% url 'casework:grant-revoke' slug=community.slug pk=grant.case_id grant_id=grant.pk %}"
        hx-post="{% url 'casework:grant-revoke' slug=community.slug pk=grant.case_id grant_id=grant.pk %}"
        hx-target="#grant-{{ grant.pk }}" hx-swap="outerHTML" hx-confirm="Revoke access?">
    {% csrf_token %}
    <button class="text-xs px-2 py-1 border border-red-300 text-red-700 rounded">Revoke</button>
  </form>
</li>
