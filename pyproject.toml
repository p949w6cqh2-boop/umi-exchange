[tool.ruff]
line-length = 120
target-version = "py312"
# hgit_sync.py is an untracked local WIP tool (not part of the app, never in
# CI's checkout). It sits in the tree and made the tree-wide pre-commit
# `ruff check .` fail on every commit → forced --no-verify everywhere, which
# disabled the real lint gate and let failures reach main. Excluding it here
# lets the hook pass so commits run clean without --no-verify.
extend-exclude = ["hgit_sync.py"]
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
[tool.ruff.lint.per-file-ignores]
# Auto-generated migrations contain long machine-written lines.
"**/migrations/*.py" = ["E501"]
# Django settings modules intentionally re-export via `from .base import *`.
"config/settings/*.py" = ["F403", "F405"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py"]
# Gate the FULL suite: top-level tests/ + every apps/*/tests/ (envelope/casework/people included).
testpaths = ["tests", "apps"]
